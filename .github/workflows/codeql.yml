# CodeQL for the TypeScript in sdk/ and services/. Solidity is covered by slither (ci.yml).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "sdk/**"
      - "services/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths:
              - sdk/src
              - sdk/scripts
              - services/src
              - services/scripts
            paths-ignore:
              - "**/node_modules"
              - "**/dist"
              - "**/test"
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript

# Dependency audit of the SDK and services lockfiles (pnpm audit) and of the whole tree (OSV-Scanner,
# which also reads the git submodules' manifests). Runs on lockfile changes, weekly, and on demand.
name: Dependency audit

on:
  push:
    branches: [main]
    paths:
      - "sdk/package.json"
      - "sdk/pnpm-lock.yaml"
      - "services/package.json"
      - "services/pnpm-lock.yaml"
      - ".gitmodules"
      - "lib/**"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    paths:
      - "sdk/package.json"
      - "sdk/pnpm-lock.yaml"
      - "services/package.json"
      - "services/pnpm-lock.yaml"
      - ".gitmodules"
      - "lib/**"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22.13"
  PNPM_VERSION: "12.6.0"

jobs:
  pnpm-audit:
    name: pnpm audit (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [sdk, services]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit (production dependencies, high and above)
        working-directory: ${{ matrix.package }}
        # Blocks on high/critical advisories in what ships; dev-only advisories are reported below.
        run: pnpm audit --prod --audit-level high
      - name: pnpm audit (all dependencies, report only)
        if: always()
        working-directory: ${{ matrix.package }}
        run: pnpm audit || true

  osv-scanner:
    name: OSV-Scanner
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      checkout-submodules: true
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: true
